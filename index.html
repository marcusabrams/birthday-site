<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>For you</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="opening-screen">
        <h1>Hi beautiful girl</h1>
        <p>I just wanted to say...</p>

        <button id="bear-button">
            <img src="bear.png" alt="cute teddy bear" id="bear-image">
        </button>

        <p class="click-text">click me</p>
        </div>

        <div class="birthday-screen">
            <h1>HAPPY BIRTHDAY!</h1>
            <p>I love you so much!</p>

            <button id="surprise-button">
                one more click..
            </button>
        </div>

        <div class="photo-screen">
            <img src="our-photo.JPG" alt="us" id="our-photo">
            <iframe
    id="youtube-player"
    width="300"
    height="200"
    src="https://www.youtube.com/embed/u9raS7-NisU"
    title="Daylight by Taylor Swift"
    frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen>
</iframe>
        </div>

        <script src="script.js"></script>
    </body>
</html>
